<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#0a1629">
  <title>{{title}}</title>
  <link rel="icon" type="image/png" href="assets/contrive-symbol.png">
  <link rel="stylesheet" href="styles.css">
  <script src="site.js" defer></script>
  <script src="mobile-navigation.js" defer></script>
  {{homeAssets}}
</head>
<body{{bodyClass}}>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="topbar">
      <div class="wrap topbar-inner">
        <span>Contrive_System</span>
        <a href="contact.html">Project enquiries <span aria-hidden="true">{{arrowIcon}}</span></a>
      </div>
    </div>
    <div class="wrap nav-row">
      <a class="brand" href="index.html" aria-label="Contrive_System home">
        <img class="brand-logo" src="assets/contrive-symbol.png" alt="" width="52" height="52">
        <span><strong>Contrive<span>_</span>System</strong><small>ELECTRICAL CONTROL PANELS</small></span>
      </a>
      <button type="button" class="menu-toggle" id="menu-toggle" aria-controls="navigation" aria-expanded="false" aria-label="Open navigation"><span></span><span></span><span></span></button>
      <nav id="navigation" aria-label="Main navigation">
        <!-- Outline interaction adapted from Uiverse.io by SelfMadeSystem. -->
        <a class="nav-item" href="index.html" data-page="home">Home</a>
        <a class="nav-item" href="about.html" data-page="about">About Us</a>
        <div class="nav-products nav-item">
          <a href="products.html" data-page="products">Our Products</a>
          <button type="button" id="products-toggle" aria-expanded="false" aria-controls="products-menu" aria-label="Show product categories">{{dropdownIcon}}</button>
          <div class="products-menu" id="products-menu" hidden>{{productsMenu}}</div>
        </div>
        <a class="nav-item" href="gallery.html" data-page="gallery">Our Gallery</a>
        <a class="nav-item" href="catalogue.html" data-page="catalogue">Catalogue</a>
        <a class="nav-item" href="blog.html" data-page="blog">Blog</a>
        <a class="nav-item" href="contact.html" data-page="contact">Contact</a>
        <a class="nav-item small-screen-quote" href="quote.html" data-page="quote">Get a Quote</a>
        <svg class="nav-outline" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <rect class="nav-outline-rect" pathLength="100" x="1" y="1" width="0" height="0" fill="transparent" stroke-width="2"></rect>
        </svg>
      </nav>
      <a class="button header-quote" href="quote.html">Get a quote</a>
    </div>
  </header>
  <main id="main" tabindex="-1">
{{content}}
  </main>
  <footer id="footer">{{footer}}
  </footer>
  {{mobileNavigation}}
  <dialog id="image-dialog" aria-labelledby="image-caption">
    <button type="button" class="dialog-close" aria-label="Close image">{{closeIcon}}</button>
    <img alt="">
    <p id="image-caption"></p>
  </dialog>
  {{compatibility}}
</body>
</html>
